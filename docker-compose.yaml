# nginx proxy address - http://172.17.0.1:8078

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  bigbluebutton:
    image: bigbluebutton/bigbluebutton:latest
    container_name: bigbluebutton-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - bigbluebutton
    ports:
      - "8078:80"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./rootfs/config/bigbluebutton:/config
      - ./rootfs/data/bigbluebutton:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bigbluebutton:
    external: false
